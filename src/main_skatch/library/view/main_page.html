    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
    
        .navbar {
            display: flex;
            justify-content: center;
            background-color: #333;
            width: 100%;
            padding: 10px 0;
            position: fixed;
            top: 0;
            z-index: 2000;
        }
    
        .navbar a {
            color: white;
            padding: 14px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
        }
    
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
    
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 60px;
        }
    
        form {
            display: flex;
            flex-direction: column;
        }
    
        label {
            margin-bottom: 5px;
        }
    
        input,
        select {
            margin-bottom: 15px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    
        button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    
        button:hover {
            background-color: #45a049;
        }
    
        .history-table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 18px;
            text-align: left;
        }
    
        .history-table th,
        .history-table td {
            padding: 12px 15px;
            border: 1px solid #ddd;
        }
    
        .history-table th {
            background-color: #f2f2f2;
        }
    
        .history-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    
        .history-table tr:nth-child(odd) {
            background-color: #fff;
        }
    
        canvas {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

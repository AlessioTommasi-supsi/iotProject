<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .navbar {
            display: flex;
            justify-content: center;
            background-color: #333;
            width: 100%;
            padding: 10px 0;
            position: fixed;
            top: 0;
        }
        .navbar a {
            color: white;
            padding: 14px 20px;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 60px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
        }
        input, select {
            margin-bottom: 15px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .history-table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 18px;
            text-align: left;
        }
        .history-table th, .history-table td {
            padding: 12px 15px;
            border: 1px solid #ddd;
        }
        .history-table th {
            background-color: #f2f2f2;
        }
        .history-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .history-table tr:nth-child(odd) {
            background-color: #fff;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }
        .circle_progressbar_chart-container {
            font-family: 'Raleway', sans-serif;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
            padding: 20px;
        }
        .circle_progressbar_chart-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
            max-width: 300px;
            min-width: 150px;
            position: relative;
        }
        .circle_progressbar_chart {
            width: 100%;
            height: auto;
        }
        .circle_progressbar_label {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .circle_progressbar_percentage {
            font-size: 1rem;
            margin-top: 10px;
        }
        .circle_progressbar_center-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: bold;
            color: #000;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }
        @media (max-width: 768px) {
            .circle_progressbar_chart-wrapper {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/monitor">Monitor</a>
        <a href="/pinout">Pinout</a>
        <a href="/currentregister">Current Register</a>
        <a href="/history">History</a>
        <a href="/graph">Graph</a>
        <a href="/config">Config</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <br>
    <br>
    <br><br>
    <br>
    <br>
    <div class="circle_progressbar_chart-container">
        <div class="circle_progressbar_chart-wrapper">
            <div class="circle_progressbar_label">CPU</div>
            <canvas id="circle_progressbar_chart_CPU" class="circle_progressbar_chart" width="200" height="200"></canvas>
            <div class="circle_progressbar_center-label" id="labelCPU">50%</div>
            <div class="circle_progressbar_percentage">Utilizzato: 50.00 / Totale: 100.00</div>
        </div>
        <div class="circle_progressbar_chart-wrapper">
            <div class="circle_progressbar_label">HEAP</div>
            <canvas id="circle_progressbar_chart_HEAP" class="circle_progressbar_chart" width="200" height="200"></canvas>
            <div class="circle_progressbar_center-label" id="labelHEAP">70%</div>
            <div class="circle_progressbar_percentage">Utilizzato: 70.00 / Totale: 100.00</div>
        </div>
        <div class="circle_progressbar_chart-wrapper">
            <div class="circle_progressbar_label">STACK</div>
            <canvas id="circle_progressbar_chart_STACK" class="circle_progressbar_chart" width="200" height="200"></canvas>
            <div class="circle_progressbar_center-label" id="labelSTACK">5%</div>
            <div class="circle_progressbar_percentage">Utilizzato: 5.00 / Totale: 100.00</div>
        </div>
    </div>
    <script>
        function createChart(ctx, percentage) {
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [percentage, 100 - percentage],
                        backgroundColor: ['#4caf50', '#ddd'],
                        borderWidth: 0
                    }]
                },
                options: {
                    cutout: '80%',
                    plugins: {
                        tooltip: { enabled: false },
                        legend: { display: false }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            createChart(document.getElementById('circle_progressbar_chart_CPU').getContext('2d'), 50);
            createChart(document.getElementById('circle_progressbar_chart_HEAP').getContext('2d'), 70);
            createChart(document.getElementById('circle_progressbar_chart_STACK').getContext('2d'), 5);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar Scorrevole Responsive - Piccola</title>
  <style>
    /* Stile per il body */
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      align-items: flex-start;
      height: 100vh;
      overflow: hidden;
    }

    /* Versione Mobile (default): navbar in basso, più piccola */
    .navbar {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      background: rgba(48, 48, 48, 0.6); /* Grigio traslucido */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      border-radius: 15px;
      padding: 8px 16px; /* padding ridotto */
      z-index: 2000;
      
      /* Posizionata in basso e centrata */
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw; /* ridotta dal 90vw all'80vw */
      
      flex-direction: row;
      overflow-x: auto; /* scroll orizzontale */
      scroll-behavior: smooth;
      gap: 8px; /* gap ridotto */
    }

    /* Rimuove la scrollbar per estetica */
    .navbar::-webkit-scrollbar {
      display: none;
    }

    /* Link della navbar */
    .navbar a {
      text-decoration: none;
      color: white;
      text-align: center;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px; /* padding interno leggermente ridotto */
      transition: transform 0.2s ease-in-out, color 0.3s ease;
    }

    /* Icone della navbar, dimensioni ridotte */
    .navbar .icon {
      width: 50px;   /* diminuito rispetto ai 60px */
      height: 50px;  /* diminuito rispetto ai 60px */
      background-color: rgba(255, 255, 255, 0.752);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;  /* ridotto rispetto ai 30px */
      color: #333;
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.2), 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    /* Testo sotto le icone, dimensione ridotta */
    .navbar span {
      font-size: 12px;  /* ridotto rispetto ai 14px */
      margin-top: 8px;
      color: white;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    /* Effetto hover */
    .navbar a:hover .icon {
      transform: scale(1.3);
      background-color: rgba(161, 255, 167, 0.7);
      color: white;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6);
    }
    .navbar a:hover span {
      color: #4CAF50;
    }

    /* Responsive per smartphone */
    @media (max-width: 480px) {
      .navbar .icon {
        width: 45px;
        height: 45px;
        font-size: 20px;
      }
      .navbar span {
        font-size: 10px;
      }
    }

    /* Versione desktop/tablet: layout verticale (min-width >= 1500px) */
    @media (min-width: 1500px) {
      .navbar {
        flex-direction: column;
        top: 50%;
        left: 15px;
        transform: translateY(-50%);
        bottom: auto;
        right: auto;
        
        /* Limita l'altezza e la larghezza per non occupare troppo spazio */
        max-height: 80vh;  /* ridotto dal 90vh all'80vh */
        width: auto;
        
        overflow-y: auto;  /* scroll verticale */
        overflow-x: hidden;
        padding: 10px;     /* padding leggermente ridotto */
      }
    }
  </style>
</head>
<body>

  <!-- Navbar Responsive -->
  <div class="navbar" id="navbar">
    <a href="/monitor">
      <div class="icon">🖥️</div>
      <span>Monitor</span>
    </a>
    <a href="/pinout">
      <div class="icon">🔌</div>
      <span>Pinout</span>
    </a>
    <a href="/currentregister">
      <div class="icon">📋</div>
      <span>Register</span>
    </a>
    <a href="/history">
      <div class="icon">⏳</div>
      <span>History</span>
    </a>
    <a href="/graph">
      <div class="icon">📈</div>
      <span>Graph</span>
    </a>
    <a href="/config">
      <div class="icon">📶</div>
      <span>Config</span>
    </a>
    <a href="/extra1">
      <div class="icon">⚙️</div>
      <span>Extra</span>
    </a>
    <a href="/extra2">
      <div class="icon">📱</div>
      <span>Mobile</span>
    </a>
  </div>

  <!-- Content Area -->
  <div style="margin-left: 130px; padding: 20px;">
    <h1>Benvenuto!</h1>
    <p>Questa è un'area dimostrativa del contenuto principale.</p>
    <p>Ridimensiona la finestra per vedere come la navbar cambia posizione e dimensione!</p>
  </div>

  <script>
    // Gestione dello scroll con la rotellina del mouse sulla navbar:
    // In modalità desktop (layout verticale) scorre verticalmente, mentre in mobile (layout orizzontale) scorre orizzontalmente.
    const navbar = document.getElementById("navbar");
    navbar.addEventListener("wheel", (e) => {
      e.preventDefault(); // Evita lo scroll della pagina principale
      if (window.innerWidth >= 1500) {
        navbar.scrollTop += e.deltaY;
      } else {
        navbar.scrollLeft += e.deltaY;
      }
    });
  </script>

</body>
</html>
